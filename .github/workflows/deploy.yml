name: ARTEMIS-2.1 Deploy to Network

on:
  workflow_dispatch:
    inputs:
      network:
        description: "Target network"
        required: true
        type: choice
        options:
          - sepolia
          - goerli
          - ethereum
        default: "sepolia"
      owner_name:
        description: "Owner name for contract constructor"
        required: false
        default: "Kushmanmb"
      project_name:
        description: "Project name for contract constructor"
        required: false
        default: "ARTEMIS-2.1"
      gas_price:
        description: "Gas price in Gwei (leave empty for auto)"
        required: false
        default: ""
      dry_run:
        description: "Dry run (compile only, no deployment)"
        required: false
        type: boolean
        default: true

jobs:
  deploy:
    name: Deploy ARTEMIS Contract
    runs-on: ubuntu-latest
    # Require GitHub Environment approval for mainnet; configure reviewers before use.
    environment: ${{ inputs.network == 'ethereum' && !inputs.dry_run && 'artemis-mainnet' || 'artemis-testnet' }}
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # Cache pip dependencies
      - name: Cache pip dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-deploy-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-deploy-
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Cache Solidity compiler
      - name: Cache solc compiler
        uses: actions/cache@v6
        with:
          path: ~/.solcx
          key: ${{ runner.os }}-solc-0.8.20

      - name: Validate deployment secrets
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          WEB3_RPC_URL: ${{ secrets.WEB3_RPC_URL }}
          DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
        run: |
          if [ -z "$WEB3_RPC_URL" ]; then
            echo "❌ WEB3_RPC_URL secret is not set"
            exit 1
          fi
          if [ -z "$DEPLOYER_PRIVATE_KEY" ]; then
            echo "❌ DEPLOYER_PRIVATE_KEY secret is not set"
            exit 1
          fi
          echo "✅ Required secrets are configured"

      - name: Deploy contract
        id: deploy
        env:
          WEB3_RPC_URL: ${{ secrets.WEB3_RPC_URL }}
          DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run }}
          INPUT_GAS_PRICE: ${{ github.event.inputs.gas_price }}
          INPUT_NETWORK: ${{ github.event.inputs.network }}
          INPUT_OWNER_NAME: ${{ github.event.inputs.owner_name }}
          INPUT_PROJECT_NAME: ${{ github.event.inputs.project_name }}
        run: |
          set -euo pipefail
          case "$INPUT_NETWORK" in
            sepolia|goerli|ethereum) ;;
            *) echo "Invalid deployment network" >&2; exit 1 ;;
          esac
          case "$INPUT_DRY_RUN" in
            true|false) ;;
            *) echo "Invalid dry-run value" >&2; exit 1 ;;
          esac
          args=(--network "$INPUT_NETWORK" --owner-name "$INPUT_OWNER_NAME" --project-name "$INPUT_PROJECT_NAME")
          if [ "$INPUT_DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          if [ -n "$INPUT_GAS_PRICE" ]; then
            if ! [[ "$INPUT_GAS_PRICE" =~ ^[0-9]+([.][0-9]+)?$ ]]; then
              echo "Invalid gas price (expected numeric Gwei)" >&2
              exit 1
            fi
            args+=(--gas-price "$INPUT_GAS_PRICE")
          fi
          # Never auto-confirm an irreversible mainnet deployment from CI.
          if [ "$INPUT_NETWORK" = "ethereum" ] && [ "$INPUT_DRY_RUN" = "false" ]; then
            echo "Live Ethereum deployment requires a separate owner-approved manual process." >&2
            exit 1
          fi
          python scripts/deploy.py "${args[@]}"

      - name: Commit deployment record
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          INPUT_NETWORK: ${{ github.event.inputs.network }}
        run: |
          git config user.name "ARTEMIS Bot"
          git config user.email "artemis-bot@users.noreply.github.com"
          if ! git diff --quiet deployments/; then
            git add deployments/
            git commit -m "chore(deploy): ARTEMIS deployed to $INPUT_NETWORK — $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi

      - name: Generate deployment summary
        env:
          INPUT_NETWORK: ${{ github.event.inputs.network }}
          INPUT_OWNER_NAME: ${{ github.event.inputs.owner_name }}
          INPUT_PROJECT_NAME: ${{ github.event.inputs.project_name }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          # Print values as data, not shell source or heredoc content.
          printf '## ARTEMIS Deployment\n\n| Parameter | Value |\n|-----------|-------|\n' >> "$GITHUB_STEP_SUMMARY"
          for key in INPUT_NETWORK INPUT_OWNER_NAME INPUT_PROJECT_NAME INPUT_DRY_RUN; do
            value="${!key}"
            value="${value//$'\n'/ }"
            value="${value//|/\\|}"
            printf '| %s | %s |\n' "$key" "$value" >> "$GITHUB_STEP_SUMMARY"
          done

          if [ -f "deployments/$INPUT_NETWORK.json" ]; then
            echo "### Deployment Record" >> $GITHUB_STEP_SUMMARY
            echo '```json' >> $GITHUB_STEP_SUMMARY
            cat "deployments/$INPUT_NETWORK.json" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload deployment artifacts
        uses: actions/upload-artifact@v7
        with:
          name: deployment-${{ github.event.inputs.network }}-${{ github.run_number }}
          path: deployments/
          retention-days: 365
