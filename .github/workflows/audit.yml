name: ARTEMIS-2.1 Continuous Blockchain Security Audit

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  schedule:
    # Run every 6 hours for 24/7 coverage
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      auto_fix:
        description: "Apply automated fixes to source files"
        required: false
        default: "false"
        type: choice
        options: ["true", "false"]

jobs:
  # Auto-label PRs based on changed files
  labeler:
    name: Label PR
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@v5
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
          configuration-path: .github/labeler.yml

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to commit auto-fixes
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Cache pip dependencies for faster builds
      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest tests/ -v --tb=short

      - name: Run ARTEMIS security audit
        id: audit
        run: |
          FIX_FLAG=""
          if [ "${{ github.event.inputs.auto_fix }}" = "true" ]; then
            FIX_FLAG="--fix"
          fi
          python -m bot.auditor \
            --path contracts \
            --report audit-report.json \
            $FIX_FLAG
        continue-on-error: true   # upload report even if findings exist

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: artemis-audit-report-${{ github.run_number }}
          path: audit-report.json
          retention-days: 90

      # Generate job summary with audit results
      - name: Generate Job Summary
        run: |
          python - <<'EOF'
          import json
          with open("audit-report.json") as f:
              report = json.load(f)
          
          counts = report["summary"]["severity_counts"]
          files = report["summary"]["files_scanned"]
          findings = report["summary"]["total_findings"]
          fixes = report["summary"]["total_auto_fixes_applied"]
          
          summary = f"""## 🛡️ ARTEMIS Security Audit Report
          
          | Metric | Value |
          |--------|-------|
          | Files Scanned | {files} |
          | Total Findings | {findings} |
          | Auto-Fixes Applied | {fixes} |
          
          ### Severity Breakdown
          
          | Severity | Count |
          |----------|-------|
          | 💀 CRITICAL | {counts.get('CRITICAL', 0)} |
          | 🔴 HIGH | {counts.get('HIGH', 0)} |
          | 🟠 MEDIUM | {counts.get('MEDIUM', 0)} |
          | 🟡 LOW | {counts.get('LOW', 0)} |
          | ℹ️ INFO | {counts.get('INFO', 0)} |
          
          """
          
          # Write to GitHub step summary
          import os
          with open(os.environ.get("GITHUB_STEP_SUMMARY", "/dev/null"), "a") as f:
              f.write(summary)
          EOF

      - name: Commit auto-fixes (if any)
        if: github.event.inputs.auto_fix == 'true' && github.event_name != 'pull_request'
        run: |
          git config user.name  "ARTEMIS Bot"
          git config user.email "artemis-bot@users.noreply.github.com"
          if ! git diff --quiet; then
            git add contracts/
            git commit -m "chore(security): ARTEMIS auto-fix — $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          else
            echo "No changes to commit."
          fi

      - name: Fail on critical/high findings
        run: |
          python - <<'EOF'
          import json, sys
          with open("audit-report.json") as f:
              report = json.load(f)
          counts = report["summary"]["severity_counts"]
          critical = counts.get("CRITICAL", 0)
          high = counts.get("HIGH", 0)
          if critical + high > 0:
              print(f"❌ ARTEMIS found {critical} CRITICAL and {high} HIGH severity issues.")
              sys.exit(1)
          else:
              print("✅ ARTEMIS: No critical or high severity issues found.")
          EOF
